<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proporzioni</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background: #f5f5f5;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      background: transparent;
    }

    .header-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 1px solid #ccc;
      padding-bottom: 10px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      color: #2c3e50;
    }

    .home-btn {
      background-color: #7f8c8d;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      box-sizing: border-box;
    }

    #top-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .voce-card {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
    }

    label {
      font-size: 14px;
      margin-top: 5px;
      display: block;
    }

    input, select, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 5px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      margin-top: 10px;
      cursor: pointer;
    }

    button:active {
      background: #0056b3;
    }

    .remove-btn {
      background: #ff4444;
    }
    
    .import-box {
      background: #e8f4fd;
      border: 1px solid #b3d7f7;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="header-nav">
    <h2>Proporzioni</h2>
    <a href="index.html" class="home-btn">🏠 Home</a>
  </div>

  <div id="top-buttons">
    <button onclick="pulisciTutto()">Pulisci tutto</button>
    <button onclick="salvaConfigurazione()" style="background: #e67e22;">Salva</button>
  </div>

  <div class="card import-box" id="ricette-salvate-card" style="display: none;">
    <h3>📂 Richiama Ricetta Salvata</h3>
    <label>Seleziona una ricetta dal calcolatore:</label>
    <select id="ricetta-selector" onchange="importaRicettaCalcolatore()">
      <option value="">-- Scegli una ricetta --</option>
    </select>
  </div>

  <div class="card">
    <h3>Voci</h3>
    <div id="voci"></div>
    <button onclick="aggiungiVoce()">+ Aggiungi voce</button>
  </div>

  <div class="card">
    <h3>Modifica proporzioni</h3>
    <label>Voce da modificare:</label>
    <select id="modIndex"></select>
    <label>Nuovo valore:</label>
    <input id="nuovoValore" type="number" placeholder="Es. 150">
    <button onclick="ricalcola()">Ricalcola</button>
  </div>

  <div class="card">
    <h3>Risultato</h3>
    <div id="risultato"></div>
  </div>

</div>

<script>
var count = 0;
var ricettaAttivaDettagli = null; // Memorizza la struttura dei macronutrienti originari

window.onload = function() {
  mappaRicetteCalcolatore();
};

function mappaRicetteCalcolatore() {
  var selector = document.getElementById("ricetta-selector");
  // Reset del selettore mantenendo solo la prima opzione vuota
  selector.innerHTML = '<option value="">-- Scegli una ricetta --</option>';
  var cardIniziale = document.getElementById("ricette-salvate-card");
  var ricette = {};

  try {
    ricette = JSON.parse(localStorage.getItem("ricette_calorie")) || {};
  } catch(e) {
    ricette = {};
  }

  var chiavi = Object.keys(ricette);

  if (chiavi.length > 0) {
    cardIniziale.style.display = "block";
    chiavi.forEach(function(nome) {
      var opt = document.createElement("option");
      opt.value = nome;
      opt.textContent = nome;
      selector.appendChild(opt);
    });
  } else {
    cardIniziale.style.display = "none";
  }
}

function importaRicettaCalcolatore() {
  var nomeSelezionato = document.getElementById("ricetta-selector").value;
  if (!nomeSelezionato) {
    ricettaAttivaDettagli = null;
    return;
  }

  var ricette = JSON.parse(localStorage.getItem("ricette_calorie")) || {};
  var ingredienti = ricette[nomeSelezionato];

  if (ingredienti && ingredienti.length > 0) {
    document.getElementById("voci").innerHTML = "";
    document.getElementById("risultato").innerHTML = "";
    document.getElementById("nuovoValore").value = "";
    count = 0;

    // Salviamo una copia locale temporanea per non perdere le proprietà dei macro durante il ricalcolo
    ricettaAttivaDettagli = JSON.parse(JSON.stringify(ingredienti));

    ingredienti.forEach(function(ing) {
      aggiungiVoce(ing.nome, ing.peso);
    });
  }
}

function aggiungiVoce(nome, valore) {
  if (!nome) nome = "";
  if (!valore) valore = "";

  var container = document.getElementById("voci");

  var card = document.createElement("div");
  card.className = "voce-card";
  card.setAttribute("data-index", count);

  card.innerHTML =
    '<label>Nome:</label>' +
    '<input type="text" id="nome' + count + '" value="' + nome + '" placeholder="Nome" oninput="aggiornaSelect()">' +
    '<label>Valore:</label>' +
    '<input type="number" id="valore' + count + '" value="' + valore + '" placeholder="Valore">';

  card.innerHTML += '<button class="remove-btn" onclick="rimuoviVoce(' + count + ')">Rimuovi</button>';

  container.appendChild(card);
  count++;
  aggiornaSelect();
}

function rimuoviVoce(i) {
  var card = document.querySelector('.voce-card[data-index="' + i + '"]');
  if (card) card.remove();
  aggiornaSelect();
}

function aggiornaSelect() {
  var sel = document.getElementById("modIndex");
  var valorePrecedente = sel.value;
  sel.innerHTML = "";

  var cards = document.querySelectorAll(".voce-card");
  for (var i = 0; i < cards.length; i++) {
    var id = cards[i].getAttribute("data-index");
    var nomeInput = document.getElementById("nome" + id);
    var nome = (nomeInput && nomeInput.value) ? nomeInput.value : ("Voce " + (i + 1));

    var opt = document.createElement("option");
    opt.value = id;
    opt.textContent = nome;
    sel.appendChild(opt);
  }
  if (valorePrecedente !== "") {
    sel.value = valorePrecedente;
  }
}

function ricalcola() {
  var cards = document.querySelectorAll(".voce-card");
  if (cards.length < 2) {
    alert("Inserisci almeno 2 voci.");
    return;
  }

  var index = document.getElementById("modIndex").value;
  var nuovo = parseFloat(document.getElementById("nuovoValore").value);
  if (isNaN(nuovo) || nuovo <= 0) {
    alert("Inserisci un valore valido.");
    return;
  }

  var valori = [];
  var nomi = [];

  for (var i = 0; i < cards.length; i++) {
    var id = cards[i].getAttribute("data-index");
    var nome = document.getElementById("nome" + id).value;
    var valore = parseFloat(document.getElementById("valore" + id).value);

    if (isNaN(valore) || valore <= 0) {
      alert("Tutti i valori devono essere numeri maggiori di zero.");
      return;
    }

    nomi.push(nome);
    valori.push(valore);
  }

  var pos = -1;
  for (var j = 0; j < cards.length; j++) {
    if (cards[j].getAttribute("data-index") == index) pos = j;
  }
  if (pos === -1) {
    alert("Voce selezionata non trovata.");
    return;
  }

  var vecchio = valori[pos];
  var rapporto = nuovo / vecchio;

  // Aggiorna visivamente i valori degli input delle voci a schermo
  for (var k = 0; k < cards.length; k++) {
    var currentId = cards[k].getAttribute("data-index");
    var inputValore = document.getElementById("valore" + currentId);
    var vecchioValoreSingolo = parseFloat(inputValore.value);
    var nuovoValoreSingolo = vecchioValoreSingolo * rapporto;
    
    inputValore.value = nuovoValoreSingolo.toFixed(1);
  }

  var nuoviValori = [];
  for (var k = 0; k < valori.length; k++) {
    nuoviValori.push(valori[k] * rapporto);
  }

  mostraRisultato(nomi, nuoviValori);
}

function mostraRisultato(nomi, valori) {
  var div = document.getElementById("risultato");
  div.innerHTML = "";

  var totale = 0;
  for (var i = 0; i < valori.length; i++) {
    totale += valori[i];
  }

  for (var j = 0; j < nomi.length; j++) {
    var perc = (valori[j] / totale) * 100;
    div.innerHTML +=
      "<strong>" + nomi[j] + "</strong>: " +
      valori[j].toFixed(2) + " (" + perc.toFixed(2) + "%)<br>";
  }

  div.innerHTML += "<br><strong>Totale complessivo:</strong> " + totale.toFixed(2);
}

function pulisciTutto() {
  document.getElementById("voci").innerHTML = "";
  document.getElementById("risultato").innerHTML = "";
  document.getElementById("nuovoValore").value = "";
  var sel = document.getElementById("ricetta-selector");
  if(sel) sel.value = "";
  ricettaAttivaDettagli = null;
  count = 0;
  aggiornaSelect();
}

/* ----------------------------------------------------
   NUOVA FUNZIONE DI SALVATAGGIO (STILE CALCOLATORE)
---------------------------------------------------- */
function salvaConfigurazione() {
  var cards = document.querySelectorAll(".voce-card");
  if (cards.length === 0) {
    alert("Nessun ingrediente inserito da salvare.");
    return;
  }

  var ricetteSalvate = JSON.parse(localStorage.getItem("ricette_calorie")) || {};
  var nomeSelezionatoSelector = document.getElementById("ricetta-selector").value;
  var nomeDefinitivoRicetta = "";

  // Stabilisce se stiamo sovrascrivendo una ricetta esistente o creandone una nuova
  if (nomeSelezionatoSelector) {
    nomeDefinitivoRicetta = nomeSelezionatoSelector;
  } else {
    var promptNome = prompt("Inserisci il nome della ricetta da salvare (stile calcolatore):");
    if (!promptNome || promptNome.trim() === "") return;
    nomeDefinitivoRicetta = promptNome.trim();
  }

  var nuovoElencoIngredienti = [];

  for (var i = 0; i < cards.length; i++) {
    var id = cards[i].getAttribute("data-index");
    var nomeIng = document.getElementById("nome" + id).value;
    var pesoIng = parseFloat(document.getElementById("valore" + id).value) || 0;

    // Se la voce deriva dal calcolatore, ricalcoliamo in proporzione anche i macro originali (kcal, proteine, ecc)
    var kcal = 0, grassi = 0, saturi = 0, carbo = 0, zuccheri = 0, proteine = 0, sale = 0;
    
    if (ricettaAttivaDettagli && ricettaAttivaDettagli[i]) {
      var vecchioPeso = ricettaAttivaDettagli[i].peso;
      var fattoreScala = vecchioPeso > 0 ? (pesoIng / vecchioPeso) : 1;
      
      kcal = (ricettaAttivaDettagli[i].kcal || 0) * fattoreScala;
      grassi = (ricettaAttivaDettagli[i].grassi || 0) * fattoreScala;
      saturi = (ricettaAttivaDettagli[i].saturi || 0) * fattoreScala;
      carbo = (ricettaAttivaDettagli[i].carbo || 0) * fattoreScala;
      zuccheri = (ricettaAttivaDettagli[i].zuccheri || 0) * fattoreScala;
      proteine = (ricettaAttivaDettagli[i].proteine || 0) * fattoreScala;
      sale = (ricettaAttivaDettagli[i].sale || 0) * fattoreScala;
    }

    nuovoElencoIngredienti.push({
      id: i,
      nome: nomeIng,
      peso: pesoIng,
      kcal: kcal,
      grassi: grassi,
      saturi: saturi,
      carbo: carbo,
      zuccheri: zuccheri,
      proteine: proteine,
      sale: sale
    });
  }

  // Salva nel database comune del browser
  ricetteSalvate[nomeDefinitivoRicetta] = nuovoElencoIngredienti;
  localStorage.setItem("ricette_calorie", JSON.stringify(ricetteSalvate));

  alert('Ricetta "' + nomeDefinitivoRicetta + '" aggiornata e memorizzata sul dispositivo.');
  
  // Aggiorna la tendina delle ricette senza resettare la pagina
  mappaRicetteCalcolatore();
  document.getElementById("ricetta-selector").value = nomeDefinitivoRicetta;
  importaRicettaCalcolatore();
}
</script>

</body>
</html>
