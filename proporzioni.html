<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Proporzioni</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 15px;
      background: #f5f5f5;
    }

    h2 {
      text-align: center;
      margin-bottom: 5px;
    }

    #top-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 10px;
      margin-bottom: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .voce-card {
      background: #fff;
      padding: 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      border: 1px solid #ddd;
    }

    label {
      font-size: 14px;
      margin-top: 5px;
      display: block;
    }

    input, select, button {
      padding: 10px;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
      margin-top: 5px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      background: #007bff;
      color: white;
      border: none;
      margin-top: 10px;
    }

    button:active {
      background: #0056b3;
    }

    .remove-btn {
      background: #ff4444;
    }
    
    /* Stile per la nuova sezione di richiamo */
    .import-box {
      background: #e8f4fd;
      border: 1px solid #b3d7f7;
    }
  </style>
</head>

<body>

<h2>Proporzioni</h2>

<div id="top-buttons">
  <button onclick="pulisciTutto()">Pulisci tutto</button>
  <button onclick="salvaConfigurazione()">Salva</button>
</div>

<div class="card import-box" id="ricette-salvate-card" style="display: none;">
  <h3>📂 Richiama Ricetta Salvata</h3>
  <label>Seleziona una ricetta dal calcolatore:</label>
  <select id="ricetta-selector" onchange="importaRicettaCalcolatore()">
    <option value="">-- Scegli una ricetta --</option>
  </select>
</div>

<div class="card">
  <h3>Voci</h3>

  <div id="voci"></div>

  <button onclick="aggiungiVoce()">+ Aggiungi voce</button>
</div>

<div class="card">
  <h3>Modifica proporzioni</h3>

  <label>Voce da modificare:</label>
  <select id="modIndex"></select>

  <label>Nuovo valore:</label>
  <input id="nuovoValore" type="number" placeholder="Es. 150">

  <button onclick="ricalcola()">Ricalcola</button>
</div>

<div class="card">
  <h3>Risultato</h3>
  <div id="risultato"></div>
</div>

<script>
var count = 0;

// Esegui il controllo del localStorage all'avvio della pagina
window.onload = function() {
  mappaRicetteCalcolatore();
};

// Cerca le ricette salvate dal calcolatore nel localStorage condiviso
function mappaRicetteCalcolatore() {
  var selector = document.getElementById("ricetta-selector");
  var cardIniziale = document.getElementById("ricette-salvate-card");
  var ricette = {};

  try {
    ricette = JSON.parse(localStorage.getItem("ricette_calorie")) || {};
  } catch(e) {
    ricette = {};
  }

  var chiavi = Object.keys(ricette);

  if (chiavi.length > 0) {
    cardIniziale.style.display = "block"; // Mostra la card solo se ci sono ricette
    chiavi.forEach(function(nome) {
      var opt = document.createElement("option");
      opt.value = nome;
      opt.textContent = nome;
      selector.appendChild(opt);
    });
  }
}

// Prende la ricetta selezionata e popola i campi "Voci" del tuo script
function importaRicettaCalcolatore() {
  var nomeSelezionato = document.getElementById("ricetta-selector").value;
  if (!nomeSelezionato) return;

  var ricette = JSON.parse(localStorage.getItem("ricette_calorie")) || {};
  var ingredienti = ricette[nomeSelezionato];

  if (ingredienti && ingredienti.length > 0) {
    // Svuota i campi correnti prima di inserire i nuovi
    document.getElementById("voci").innerHTML = "";
    document.getElementById("risultato").innerHTML = "";
    document.getElementById("nuovoValore").value = "";
    count = 0;

    // Cicla gli ingredienti e usa la tua funzione nativa aggiungiVoce()
    ingredienti.forEach(function(ing) {
      aggiungiVoce(ing.nome, ing.peso);
    });
  }
}

function aggiungiVoce(nome, valore) {
  if (!nome) nome = "";
  if (!valore) valore = "";

  var container = document.getElementById("voci");

  var card = document.createElement("div");
  card.className = "voce-card";
  card.setAttribute("data-index", count);

  card.innerHTML =
    '<label>Nome:</label>' +
    '<input type="text" id="nome' + count + '" value="' + nome + '" placeholder="Nome">' +
    '<label>Valore:</label>' +
    '<input type="number" id="valore' + count + '" value="' + valore + '" placeholder="Valore">' +
    '<button class="remove-btn" onclick="rimuoviVoce(' + count + ')">Rimuovi</button>';

  container.appendChild(card);
  count++;
  aggiornaSelect();
}

function rimuoviVoce(i) {
  var card = document.querySelector('.voce-card[data-index="' + i + '"]');
  if (card) card.remove();
  aggiornaSelect();
}

function aggiornaSelect() {
  var sel = document.getElementById("modIndex");
  sel.innerHTML = "";

  var cards = document.querySelectorAll(".voce-card");
  for (var i = 0; i < cards.length; i++) {
    var id = cards[i].getAttribute("data-index");
    var nomeInput = document.getElementById("nome" + id);
    var nome = (nomeInput && nomeInput.value) ? nomeInput.value : ("Voce " + (i + 1));

    var opt = document.createElement("option");
    opt.value = id;
    opt.textContent = nome;
    sel.appendChild(opt);
  }
}

function ricalcola() {
  var cards = document.querySelectorAll(".voce-card");
  if (cards.length < 2) {
    alert("Inserisci almeno 2 voci.");
    return;
  }

  var index = document.getElementById("modIndex").value;
  var nuovo = parseFloat(document.getElementById("nuovoValore").value);
  if (isNaN(nuovo) || nuovo <= 0) {
    alert("Inserisci un valore valido.");
    return;
  }

  var valori = [];
  var nomi = [];

  for (var i = 0; i < cards.length; i++) {
    var id = cards[i].getAttribute("data-index");
    var nome = document.getElementById("nome" + id).value;
    var valore = parseFloat(document.getElementById("valore" + id).value);

    if (isNaN(valore) || valore <= 0) {
      alert("Tutti i valori devono essere numeri maiores di zero.");
      return;
    }

    nomi.push(nome);
    valori.push(valore);
  }

  var pos = -1;
  for (var j = 0; j < cards.length; j++) {
    if (cards[j].getAttribute("data-index") == index) pos = j;
  }
  if (pos === -1) {
    alert("Voce selezionata non trovata.");
    return;
  }

  var vecchio = valori[pos];
  var rapporto = nuovo / vecchio;

  var nuoviValori = [];
  for (var k = 0; k < valori.length; k++) {
    nuoviValori.push(valori[k] * rapporto);
  }

  mostraRisultato(nomi, nuoviValori);
}

function mostraRisultato(nomi, valori) {
  var div = document.getElementById("risultato");
  div.innerHTML = "";

  var totale = 0;
  for (var i = 0; i < valori.length; i++) {
    totale += valori[i];
  }

  for (var j = 0; j < nomi.length; j++) {
    var perc = (valori[j] / totale) * 100;
    div.innerHTML +=
      "<strong>" + nomi[j] + "</strong>: " +
      valori[j].toFixed(2) + " (" + perc.toFixed(2) + "%)<br>";
  }

  div.innerHTML += "<br><strong>Totale:</strong> " + totale.toFixed(2);
}

function pulisciTutto() {
  document.getElementById("voci").innerHTML = "";
  document.getElementById("risultato").innerHTML = "";
  document.getElementById("nuovoValore").value = "";
  document.getElementById("ricetta-selector").value = "";
  count = 0;
  aggiornaSelect();
}

function salvaConfigurazione() {
  var titolo = prompt("Nome del file da salvare:");
  if (!titolo) return;

  var cards = document.querySelectorAll(".voce-card");
  var dati = [];

  for (var i = 0; i < cards.length; i++) {
    var id = cards[i].getAttribute("data-index");
    dati.push({
      nome: document.getElementById("nome" + id).value,
      valore: document.getElementById("valore" + id).value
    });
  }

  var contenuto = JSON.stringify(dati, null, 2);
  var blob = new Blob([contenuto], { type: "application/json" });
  var url = URL.createObjectURL(blob);

  var a = document.createElement("a");
  a.href = url;
  a.download = titolo + ".json";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);

  URL.revokeObjectURL(url);
}
</script>

</body>
</html>
