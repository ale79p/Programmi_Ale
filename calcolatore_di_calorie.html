<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore Ricette con Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --scan-color: #9b59b6;
            --background-color: #f1f2f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background-color);
            padding: 15px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Barra di navigazione superiore con tasto Home incorporato */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .home-btn {
            background-color: #7f8c8d;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }

        .home-btn:active {
            background-color: #95a5a6;
        }

        h1 {
            color: var(--primary-color);
            font-size: 18px;
            margin: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px; /* Evita lo zoom automatico della pagina su Safari iOS */
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        /* Pulsante dello Scanner Fotocamera */
        .scanner-wrapper {
            margin-bottom: 20px;
        }

        .custom-file-upload {
            display: block;
            background-color: var(--scan-color);
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        .custom-file-upload:active {
            opacity: 0.9;
        }

        #barcode-file-input {
            display: none; /* Nasconde l'input file standard */
        }

        .loading {
            text-align: center;
            display: none;
            color: #7f8c8d;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            font-weight: 500;
        }

        .results-select-wrapper {
            margin-bottom: 15px;
            display: none;
            background: #eef7fc;
            padding: 12px;
            border-radius: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-top: 5px;
            background-color: white;
        }

        .weight-section {
            display: none;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--success-color);
        }

        .btn-success {
            background-color: var(--success-color);
            width: 100%;
            margin-top: 10px;
        }

        .recipe-summary {
            margin-top: 20px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .total-box {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 15px;
            text-align: right;
            background: #fff3e0;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-nav">
        <h1>Calcolatore & Scanner</h1>
        <a href="index.html" class="home-btn">🏠 Home</a>
    </div>

    <div class="scanner-wrapper">
        <label for="barcode-file-input" class="custom-file-upload">
            📷 Scansiona Codice a Barre
        </label>
        <input type="file" id="barcode-file-input" accept="image/*" capture="environment" onchange="analizzaImmagine(event)">
    </div>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="Cerca ingrediente o inserisci codice">
        <button onclick="avviaRicercaTermine()">Cerca</button>
    </div>

    <div class="loading" id="loading-indicator">Elaborazione...</div>

    <div class="results-select-wrapper" id="results-wrapper">
        <label style="font-size: 13px; font-weight: bold; color: var(--primary-color);">Prodotto trovato (Seleziona se ce ne sono più):</label>
        <select id="products-select" onchange="mostraSezionePeso()"></select>
    </div>

    <div class="weight-section" id="weight-section">
        <p id="info-prodotto-selezionato" style="margin: 0 0 10px 0; font-size: 14px; color: #333; font-weight: bold;"></p>
        <input type="number" id="weight-input" placeholder="Inserisci il peso in grammi (g)">
        <button class="btn-success" onclick="aggiungiAFormulazione()">Aggiungi alla Ricetta</button>
    </div>

    <div class="recipe-summary">
        <h3 style="color: var(--primary-color); font-size: 16px; margin-bottom: 10px;">Ingredienti aggiunti:</h3>
        <div id="lista-ingredienti"></div>
        <div class="total-box">Totale Ricetta: <span id="totale-calorie">0</span> kcal</div>
    </div>
</div>

<script>
    let calorieTotali = 0;
    let prodottoCorrenteSelezionato = null;

    // 1. Gestione Foto/Scansione da iPhone
    function analizzaImmagine(event) {
        const file = event.target.files[0];
        if (!file) return;

        const loading = document.getElementById('loading-indicator');
        loading.style.display = 'block';
        loading.innerText = "Decodifica codice a barre...";

        const html5QrCode = new Html5Qrcode("loading-indicator");
        
        html5QrCode.scanFile(file, true)
            .then(barcodeResult => {
                loading.style.display = 'none';
                document.getElementById('search-input').value = barcodeResult;
                // Richiama l'API interpretando il valore come codice a barre (true)
                eseguiFetchAPI(barcodeResult, true);
            })
            .catch(err => {
                loading.style.display = 'none';
                alert("Impossibile rilevare un codice a barre nitido. Assicurati che l'immagine sia a fuoco o inserisci il codice/nome manualmente.");
                console.error(err);
            });
    }

    // Identifica se l'utente sta cercando una parola o un codice numerico scritto a mano
    function avviaRicercaTermine() {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return alert("Digita un nome di un alimento o un codice prima di cercare.");
        const isBarcode = /^\d+$/.test(query);
        eseguiFetchAPI(query, isBarcode);
    }

    // 2. Interrogazione sicura alle API v2 di Open Food Facts
    async function eseguiFetchAPI(query, isBarcode) {
        const loading = document.getElementById('loading-indicator');
        const wrapper = document.getElementById('results-wrapper');
        const select = document.getElementById('products-select');
        
        loading.style.display = 'block';
        loading.innerText = "Connessione all'API in corso...";
        wrapper.style.display = 'none';
        document.getElementById('weight-section').style.display = 'none';
        select.innerHTML = '';

        try {
            // Utilizzo di endpoint v2 standardizzati per evitare problemi di CORS
            const url = isBarcode 
                ? `https://world.openfoodfacts.org/api/v2/product/${query}.json`
                : `https://world.openfoodfacts.org/api/v2/search?categories_tags=${encodeURIComponent(query)}&fields=product_name,brands,nutriments&page_size=10`;

            // Configurazione della richiesta con User-Agent identificativo
            const response = await fetch(url, {
                headers: {
                    'User-Agent': 'MioCalcolatoreCalorieCucina/1.0 (iPhone App)'
                }
            });
            
            const data = await response.json();
            loading.style.display = 'none';

            let prodotti = [];
            if (isBarcode && data.status === 1) {
                prodotti.push(data.product);
            } else if (!isBarcode && data.products && data.products.length > 0) {
                prodotti = data.products;
            }

            if (prodotti.length === 0) {
                alert("Nessun alimento corrispondente trovato. Controlla il codice o prova con un termine più comune (es: 'cacao').");
                return;
            }

            let prodottiValidi = 0;
            prodotti.forEach(p => {
                // Estrazione sicura del valore calorico riferito a 100g
                const kcal = p.nutriments ? p.nutriments['energy-kcal_100g'] : null;
                if (kcal !== undefined && kcal !== null) {
                    const option = document.createElement('option');
                    option.value = kcal;
                    option.text = `${p.product_name || 'Prodotto non nominato'} (${p.brands || 'Brand generico'}) - ${kcal} kcal/100g`;
                    option.dataset.name = p.product_name || 'Alimento';
                    select.appendChild(option);
                    prodottiValidi++;
                }
            });

            if(prodottiValidi === 0) {
                alert("Prodotto individuato nel database, ma non contiene la tabella calorica necessaria al calcolo.");
                return;
            }

            wrapper.style.display = 'block';
            mostraSezionePeso();

        } catch (error) {
            loading.style.display = 'none';
            console.error("Dettagli errore riscontrato:", error);
            alert("Errore di rete o blocco di sicurezza del browser. Verifica la connessione. Nota: Lo scanner richiede che l'app sia pubblicata in HTTPS (es. GitHub Pages) per funzionare su iOS.");
        }
    }

    // Mostra la scheda per l'inserimento dei grammi dell'alimento selezionato
    function mostraSezionePeso() {
        const select = document.getElementById('products-select');
        if(select.options.length === 0) return;
        
        const opzioneSelezionata = select.options[select.selectedIndex];
        
        prodottoCorrenteSelezionato = {
            nome: opzioneSelezionata.dataset.name,
            kcal100g: parseFloat(opzioneSelezionata.value)
        };

        document.getElementById('info-prodotto-selezionato').innerText = 
            `${prodottoCorrenteSelezionato.nome} (${prodottoCorrenteSelezionato.kcal100g} kcal/100g)`;
        document.getElementById('weight-section').style.display = 'block';
    }

    // Calcola l'apporto in base ai grammi e aggiorna il totale progressivo
    function aggiungiAFormulazione() {
        const pesoInput = document.getElementById('weight-input');
        const grammi = parseFloat(pesoInput.value);

        if (isNaN(grammi) || grammi <= 0) {
            alert("Inserisci una quantità in grammi valida e maggiore di zero.");
            return;
        }

        const calorieIngrediente = (prodottoCorrenteSelezionato.kcal100g * grammi) / 100;
        calorieTotali += calorieIngrediente;

        // Aggiunta visiva alla lista degli ingredienti caricati
        const lista = document.getElementById('lista-ingredienti');
        const item = document.createElement('div');
        item.className = 'ingredient-item';
        item.innerHTML = `<span>🔹 ${prodottoCorrenteSelezionato.nome} (${grammi}g)</span><span><strong>+${calorieIngrediente.toFixed(1)}</strong> kcal</span>`;
        lista.appendChild(item);

        // Aggiorna la box del totale complessivo
        document.getElementById('totale-calorie').innerText = calorieTotali.toFixed(1);

        // Ripristino dello stato iniziale per il prossimo ingrediente
        pesoInput.value = '';
        document.getElementById('weight-section').style.display = 'none';
        document.getElementById('results-wrapper').style.display = 'none';
        document.getElementById('search-input').value = '';
        document.getElementById('barcode-file-input').value = ''; 
    }
</script>

</body>
</html>
