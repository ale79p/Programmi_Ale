<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore Ricette</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --scan-color: #9b59b6;
            --background-color: #f1f2f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background-color);
            padding: 15px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .home-btn {
            background-color: #7f8c8d;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            color: var(--primary-color);
            font-size: 18px;
            margin: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .custom-file-upload {
            display: block;
            background-color: var(--scan-color);
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        #barcode-file-input {
            display: none;
        }

        .loading {
            text-align: center;
            display: none;
            color: #7f8c8d;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .results-select-wrapper {
            margin-bottom: 15px;
            display: none;
            background: #eef7fc;
            padding: 12px;
            border-radius: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-top: 5px;
            background-color: white;
        }

        .weight-section {
            display: none;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--success-color);
        }

        .btn-success {
            background-color: var(--success-color);
            width: 100%;
            margin-top: 10px;
        }

        .recipe-summary {
            margin-top: 20px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }

        .ingredient-item {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .ingredient-main {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
        }

        .ingredient-details {
            font-size: 12px;
            color: #666;
            margin-top: 3px;
        }

        /* Tabella Riepilogo Valori Totali */
        .total-macros-box {
            margin-top: 15px;
            background: #fff3e0;
            padding: 12px;
            border-radius: 8px;
            font-size: 14px;
        }

        .macro-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px dashed #ffd180;
        }

        .macro-row:last-child {
            border-bottom: none;
            font-size: 18px;
            font-weight: bold;
            color: #d35400;
            margin-top: 5px;
            padding-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-nav">
        <h1>Calcolatore & Scanner</h1>
        <a href="index.html" class="home-btn">🏠 Home</a>
    </div>

    <div>
        <label for="barcode-file-input" class="custom-file-upload">
            📷 Fotografa Codice a Barre
        </label>
        <input type="file" id="barcode-file-input" accept="image/*" capture="environment" onchange="analizzaFotoConServer(event)">
    </div>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="Cerca ingrediente (es: farina, cacao)">
        <button onclick="avviaRicercaTesto()">Cerca</button>
    </div>

    <div class="loading" id="loading-indicator">In attesa dei dati...</div>

    <div class="results-select-wrapper" id="results-wrapper">
        <label style="font-size: 13px; font-weight: bold; color: var(--primary-color);">Alimenti trovati (Seleziona):</label>
        <select id="products-select" onchange="mostraSezionePeso()"></select>
    </div>

    <div class="weight-section" id="weight-section">
        <p id="info-prodotto-selezionato" style="margin: 0 0 10px 0; font-size: 14px; color: #333; font-weight: bold;"></p>
        <input type="number" id="weight-input" placeholder="Peso in grammi (g)">
        <button class="btn-success" onclick="aggiungiAFormulazione()">Aggiungi alla Ricetta</button>
    </div>

    <div class="recipe-summary">
        <h3 style="color: var(--primary-color); font-size: 16px; margin-bottom: 10px;">Ingredienti aggiunti:</h3>
        <div id="lista-ingredienti"></div>
        
        <div class="total-macros-box">
            <h4 style="margin: 0 0 8px 0; color: #d35400; font-size: 15px;">Valori Nutrizionali Totali:</h4>
            <div class="macro-row"><span>Grassi:</span> <span id="tot-grassi">0.0</span> g</div>
            <div class="macro-row"><span>di cui Saturi:</span> <span id="tot-saturi">0.0</span> g</div>
            <div class="macro-row"><span>Carboidrati:</span> <span id="tot-carbo">0.0</span> g</div>
            <div class="macro-row"><span>di cui Zuccheri:</span> <span id="tot-zuccheri">0.0</span> g</div>
            <div class="macro-row"><span>Proteine:</span> <span id="tot-proteine">0.0</span> g</div>
            <div class="macro-row"><span>Sale:</span> <span id="tot-sale">0.0</span> g</div>
            <div class="macro-row"><span>Energia Totale:</span> <span id="totale-calorie">0.0</span> kcal</div>
        </div>
    </div>
</div>

<script>
    // Registro dei totali cumulativi della ricetta
    let totaliRicetta = { kcal: 0, grassi: 0, saturi: 0, carbo: 0, zuccheri: 0, proteine: 0, sale: 0 };
    let prodottoCorrenteSelezionato = null;

    async function avviaRicercaTesto() {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return alert("Inserisci un termine di ricerca.");
        
        gestisciInterfacceCaricamento(true, "Ricerca mirata nel database italiano...");

        try {
            const url = `https://it.openfoodfacts.org/api/v2/search?countries_tags=italia&keywords=${encodeURIComponent(query)}&fields=product_name,brands,nutriments&page_size=24`;
            const response = await fetch(url, { headers: { 'User-Agent': 'MioCalcolatoreCalorieCucina/1.0' } });
            const data = await response.json();
            
            gestisciInterfacceCaricamento(false);
            
            if (data.products && data.products.length > 0) {
                popolaSelettoreProdotti(data.products);
            } else {
                alert("Nessun alimento trovato. Prova a cambiare termine.");
            }
        } catch (error) {
            gestisciInterfacceCaricamento(false);
            alert("Errore di connessione. Riprova.");
        }
    }

    async function analizzaFotoConServer(event) {
        const file = event.target.files[0];
        if (!file) return;

        gestisciInterfacceCaricamento(true, "Lettura del codice a barre...");
        const formData = new FormData();
        formData.append('barcode_image', file);

        try {
            const response = await fetch('https://world.openfoodfacts.org/api/v2/scan', { method: 'POST', body: formData });
            const data = await response.json();
            gestisciInterfacceCaricamento(false);

            if (data.status === 1 && data.product) {
                popolaSelettoreProdotti([data.product]);
            } else {
                alert("Codice a barre non rilevato nitidamente.");
            }
        } catch (error) {
            gestisciInterfacceCaricamento(false);
            alert("Errore di elaborazione dell'immagine.");
        }
    }

    function popolaSelettoreProdotti(prodotti) {
        const wrapper = document.getElementById('results-wrapper');
        const select = document.getElementById('products-select');
        select.innerHTML = '';
        let prodottiValidi = 0;

        prodotti.forEach(p => {
            const nut = p.nutriments || {};
            const kcal = nut['energy-kcal_100g'];
            
            if (kcal !== undefined && kcal !== null) {
                const option = document.createElement('option');
                
                // Salviamo l'intera mappa dei nutrienti in formato testo per recuperarla al cambio opzione
                option.value = JSON.stringify({
                    kcal: parseFloat(kcal),
                    grassi: parseFloat(nut['fat_100g'] || 0),
                    saturi: parseFloat(nut['saturated-fat_100g'] || 0),
                    carbo: parseFloat(nut['carbohydrates_100g'] || 0),
                    zuccheri: parseFloat(nut['sugars_100g'] || 0),
                    proteine: parseFloat(nut['proteins_100g'] || 0),
                    sale: parseFloat(nut['salt_100g'] || 0)
                });

                const nome = p.product_name || 'Alimento generico';
                const marca = p.brands || 'Generico';
                option.text = `${nome} (${marca}) - ${kcal} kcal/100g`;
                option.dataset.name = nome;
                select.appendChild(option);
                prodottiValidi++;
            }
        });

        if (prodottiValidi > 0) {
            wrapper.style.display = 'block';
            mostraSezionePeso();
        } else {
            alert("I prodotti trovati non contengono i dati nutrizionali necessari.");
        }
    }

    function mostraSezionePeso() {
        const select = document.getElementById('products-select');
        if(select.options.length === 0) return;
        
        const opzioneSelezionata = select.options[select.selectedIndex];
        const macro100g = JSON.parse(opzioneSelezionata.value);

        prodottoCorrenteSelezionato = {
            nome: opzioneSelezionata.dataset.name,
            nutrienti: macro100g
        };

        document.getElementById('info-prodotto-selezionato').innerText = 
            `${prodottoCorrenteSelezionato.nome} (${prodottoCorrenteSelezionato.nutrienti.kcal} kcal/100g)`;
        document.getElementById('weight-section').style.display = 'block';
    }

    function aggiungiAFormulazione() {
        const pesoInput = document.getElementById('weight-input');
        const grammi = parseFloat(pesoInput.value);

        if (isNaN(grammi) || grammi <= 0) {
            return alert("Inserisci un peso valido.");
        }

        const fattore = grammi / 100;
        const n = prodottoCorrenteSelezionato.nutrienti;

        // Calcolo valori proporzionali per questo ingrediente
        const ingKcal = n.kcal * fattore;
        const ingGrassi = n.grassi * fattore;
        const ingSaturi = n.saturi * fattore;
        const ingCarbo = n.carbo * fattore;
        const ingZuccheri = n.zuccheri * fattore;
        const ingProteine = n.proteine * fattore;
        const ingSale = n.sale * fattore;

        // Aggiornamento dei totali generali della ricetta
        totaliRicetta.kcal += ingKcal;
        totaliRicetta.grassi += ingGrassi;
        totaliRicetta.saturi += ingSaturi;
        totaliRicetta.carbo += ingCarbo;
        totaliRicetta.zuccheri += ingZuccheri;
        totaliRicetta.proteine += ingProteine;
        totaliRicetta.sale += ingSale;

        // Creazione visiva dell'ingrediente con il sotto-riepilogo dei dettagli micro
        const lista = document.getElementById('lista-ingredienti');
        const item = document.createElement('div');
        item.className = 'ingredient-item';
        item.innerHTML = `
            <div class="ingredient-main">
                <span>🔹 ${prodottoCorrenteSelezionato.nome} (${grammi}g)</span>
                <span>+${ingKcal.toFixed(1)} kcal</span>
            </div>
            <div class="ingredient-details">
                G: ${ingGrassi.toFixed(1)}g | C: ${ingCarbo.toFixed(1)}g | P: ${ingProteine.toFixed(1)}g
            </div>
        `;
        lista.appendChild(item);

        // Aggiornamento della tabella dei totali a schermo
        document.getElementById('tot-grassi').innerText = totaliRicetta.grassi.toFixed(1);
        document.getElementById('tot-saturi').innerText = totaliRicetta.saturi.toFixed(1);
        document.getElementById('tot-carbo').innerText = totaliRicetta.carbo.toFixed(1);
        document.getElementById('tot-zuccheri').innerText = totaliRicetta.zuccheri.toFixed(1);
        document.getElementById('tot-proteine').innerText = totaliRicetta.proteine.toFixed(1);
        document.getElementById('tot-sale').innerText = totaliRicetta.sale.toFixed(2);
        document.getElementById('totale-calorie').innerText = totaliRicetta.kcal.toFixed(1);

        // Reset campi di input
        pesoInput.value = '';
        document.getElementById('weight-section').style.display = 'none';
        document.getElementById('results-wrapper').style.display = 'none';
        document.getElementById('search-input').value = '';
        document.getElementById('barcode-file-input').value = ''; 
    }

    function gestisciInterfacceCaricamento(mostra, testo = "") {
        const loading = document.getElementById('loading-indicator');
        if (mostra) {
            loading.style.display = 'block';
            loading.innerText = testo;
            document.getElementById('results-wrapper').style.display = 'none';
            document.getElementById('weight-section').style.display = 'none';
        } else {
            loading.style.display = 'none';
        }
    }
</script>

</body>
</html>
