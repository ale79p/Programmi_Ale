<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calcolatore Ricette</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --scan-color: #9b59b6;
            --background-color: #f1f2f6;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background-color);
            padding: 15px;
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .home-btn {
            background-color: #7f8c8d;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }

        h1 {
            color: var(--primary-color);
            font-size: 18px;
            margin: 0;
        }

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 18px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
        }

        .custom-file-upload {
            display: block;
            background-color: var(--scan-color);
            color: white;
            padding: 12px;
            text-align: center;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            -webkit-tap-highlight-color: transparent;
        }

        #barcode-file-input {
            display: none;
        }

        .loading {
            text-align: center;
            display: none;
            color: #7f8c8d;
            margin: 15px 0;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
        }

        .results-select-wrapper {
            margin-bottom: 15px;
            display: none;
            background: #eef7fc;
            padding: 12px;
            border-radius: 8px;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 16px;
            margin-top: 5px;
            background-color: white;
        }

        .weight-section {
            display: none;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border-left: 4px solid var(--success-color);
        }

        .btn-success {
            background-color: var(--success-color);
            width: 100%;
            margin-top: 10px;
        }

        .recipe-summary {
            margin-top: 20px;
            border-top: 2px solid #eee;
            padding-top: 15px;
        }

        .ingredient-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .total-box {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            margin-top: 15px;
            text-align: right;
            background: #fff3e0;
            padding: 10px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    
    <div class="header-nav">
        <h1>Calcolatore & Scanner</h1>
        <a href="index.html" class="home-btn">🏠 Home</a>
    </div>

    <div>
        <label for="barcode-file-input" class="custom-file-upload">
            📷 Fotografa Codice a Barre
        </label>
        <input type="file" id="barcode-file-input" accept="image/*" capture="environment" onchange="analizzaFotoConServer(event)">
    </div>

    <div class="search-box">
        <input type="text" id="search-input" placeholder="Cerca ingrediente (es: farina, cacao)">
        <button onclick="avviaRicercaTesto()">Cerca</button>
    </div>

    <div class="loading" id="loading-indicator">In attesa dei dati...</div>

    <div class="results-select-wrapper" id="results-wrapper">
        <label style="font-size: 13px; font-weight: bold; color: var(--primary-color);">Alimenti trovati (Seleziona):</label>
        <select id="products-select" onchange="mostraSezionePeso()"></select>
    </div>

    <div class="weight-section" id="weight-section">
        <p id="info-prodotto-selezionato" style="margin: 0 0 10px 0; font-size: 14px; color: #333; font-weight: bold;"></p>
        <input type="number" id="weight-input" placeholder="Peso in grammi (g)">
        <button class="btn-success" onclick="aggiungiAFormulazione()">Aggiungi alla Ricetta</button>
    </div>

    <div class="recipe-summary">
        <h3 style="color: var(--primary-color); font-size: 16px; margin-bottom: 10px;">Ingredienti aggiunti:</h3>
        <div id="lista-ingredienti"></div>
        <div class="total-box">Totale Ricetta: <span id="totale-calorie">0</span> kcal</div>
    </div>
</div>

<script>
    let calorieTotali = 0;
    let prodottoCorrenteSelezionato = null;

    // NUOVA RICERCA V2 CON FILTRO ITALIA E PAROLA CHIAVE PERFETTA
    async function avviaRicercaTesto() {
        const query = document.getElementById('search-input').value.trim();
        if (!query) return alert("Inserisci un termine di ricerca.");
        
        gestisciInterfacceCaricamento(true, "Ricerca mirata nel database italiano...");

        try {
            // API v2: cerca i prodotti che contengono la parola nel nome, filtrando solo per il mercato italiano (it)
            const url = `https://it.openfoodfacts.org/api/v2/search?countries_tags=italia&keywords=${encodeURIComponent(query)}&fields=product_name,brands,nutriments&page_size=24`;
            
            const response = await fetch(url, {
                headers: { 'User-Agent': 'MioCalcolatoreCalorieCucina/1.0' }
            });
            const data = await response.json();
            
            gestisciInterfacceCaricamento(false);
            
            if (data.products && data.products.length > 0) {
                popolaSelettoreProdotti(data.products);
            } else {
                alert("Nessun alimento trovato con questo nome. Prova a essere più specifico.");
            }
        } catch (error) {
            gestisciInterfacceCaricamento(false);
            alert("Errore di connessione con il database delle calorie. Riprova.");
        }
    }

    // SCANSIONE TRAMITE IMMAGINE (FUNZIONANTE)
    async function analizzaFotoConServer(event) {
        const file = event.target.files[0];
        if (!file) return;

        gestisciInterfacceCaricamento(true, "Lettura del codice a barre...");

        const formData = new FormData();
        formData.append('barcode_image', file);

        try {
            const response = await fetch('https://world.openfoodfacts.org/api/v2/scan', {
                method: 'POST',
                body: formData
            });
            
            const data = await response.json();
            gestisciInterfacceCaricamento(false);

            if (data.status === 1 && data.product) {
                popolaSelettoreProdotti([data.product]);
            } else {
                alert("Codice a barre non rilevato nella foto. Prova a scrivere il nome dell'ingrediente.");
            }
        } catch (error) {
            gestisciInterfacceCaricamento(false);
            alert("Impossibile elaborare l'immagine. Usa la ricerca manuale per nome.");
        }
    }

    function popolaSelettoreProdotti(prodotti) {
        const wrapper = document.getElementById('results-wrapper');
        const select = document.getElementById('products-select');
        select.innerHTML = '';
        let prodottiValidi = 0;

        prodotti.forEach(p => {
            const kcal = p.nutriments ? p.nutriments['energy-kcal_100g'] : null;
            if (kcal !== undefined && kcal !== null) {
                const option = document.createElement('option');
                option.value = kcal;
                // Mostra un nome pulito unendo marca e prodotto
                const nomeProdotto = p.product_name || 'Alimento generico';
                const marcaProdotto = p.brands || 'Generico';
                option.text = `${nomeProdotto} (${marcaProdotto}) - ${kcal} kcal/100g`;
                option.dataset.name = nomeProdotto;
                select.appendChild(option);
                prodottiValidi++;
            }
        });

        if (prodottiValidi > 0) {
            wrapper.style.display = 'block';
            mostraSezionePeso();
        } else {
            alert("I prodotti trovati non contengono informazioni sulle calorie (kcal).");
        }
    }

    function mostraSezionePeso() {
        const select = document.getElementById('products-select');
        if(select.options.length === 0) return;
        
        const opzioneSelezionata = select.options[select.selectedIndex];
        prodottoCorrenteSelezionato = {
            nome: opzioneSelezionata.dataset.name,
            kcal100g: parseFloat(opzioneSelezionata.value) // CORRETTO REFUSO DI BATTITURA VECCHIO
        };

        document.getElementById('info-prodotto-selezionato').innerText = 
            `${prodottoCorrenteSelezionato.nome} (${prodottoCorrenteSelezionato.kcal100g} kcal/100g)`;
        document.getElementById('weight-section').style.display = 'block';
    }

    function aggiungiAFormulazione() {
        const pesoInput = document.getElementById('weight-input');
        const grammi = parseFloat(pesoInput.value);

        if (isNaN(grammi) || grammi <= 0) {
            alert("Inserisci un peso valido maggiore di zero.");
            return;
        }

        const calorieIngrediente = (prodottoCorrenteSelezionato.kcal100g * grammi) / 100;
        calorieTotali += calorieIngrediente;

        const lista = document.getElementById('lista-ingredienti');
        const item = document.createElement('div');
        item.className = 'ingredient-item';
        item.innerHTML = `<span>🔹 ${prodottoCorrenteSelezionato.nome} (${grammi}g)</span><span><strong>+${calorieIngrediente.toFixed(1)}</strong> kcal</span>`;
        lista.appendChild(item);

        document.getElementById('totale-calorie').innerText = calorieTotali.toFixed(1);

        // Reset dei campi per l'ingrediente successivo
        pesoInput.value = '';
        document.getElementById('weight-section').style.display = 'none';
        document.getElementById('results-wrapper').style.display = 'none';
        document.getElementById('search-input').value = '';
        document.getElementById('barcode-file-input').value = ''; 
    }

    function gestisciInterfacceCaricamento(mostra, testo = "") {
        const loading = document.getElementById('loading-indicator');
        if (mostra) {
            loading.style.display = 'block';
            loading.innerText = testo;
            document.getElementById('results-wrapper').style.display = 'none';
            document.getElementById('weight-section').style.display = 'none';
        } else {
            loading.style.display = 'none';
        }
    }
</script>

</body>
</html>
